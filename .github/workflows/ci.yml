name: CI Gate

on:
  push:
    branches:
      - dramashort-app
      - main
  pull_request:
    branches:
      - dramashort-app
      - main

jobs:
  verify:
    name: Typecheck, Lint, Build, Test & Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # The values below only satisfy lib/config/env-validator.mjs, which refuses
      # to build in production with missing or placeholder configuration. None of
      # them is a real credential: requests to Supabase made during the build are
      # rejected with "Invalid API key" and the pages fall back to empty data.
      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONTENT_SUPABASE_URL: https://czkkzoiuyqybafacpgsp.supabase.co
          NEXT_PUBLIC_CONTENT_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
          NEXT_PUBLIC_USER_SUPABASE_URL: https://bpidsbcrvpkavvdvtpgh.supabase.co
          NEXT_PUBLIC_USER_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-not-a-real-credential
          CRON_SECRET: ci-cron-secret-not-a-real-credential

      # Runs after the build on purpose: the bundle-budget tests read the build
      # output in .next and fail without it. The suite itself runs without any
      # of the build's environment variables, exactly as it does locally.
      - name: Automated Security & Regression Test Suite
        run: npm test

      - name: First-Load JS Bundle Budget Gate (Task 17.3)
        run: npm run check:budget

      - name: npm Dependency Security Audit Gate (P1 Step 11)
        run: npm run check:audit

  supabase-rls-verification:
    name: Supabase Database RLS & Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Same major line as the `supabase` dev dependency in package.json. The
      # configs target Postgres 17, which CLI 1.x does not know.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start User DB & Run Migrations
        run: supabase start --workdir supabase/user

      # psql exits non-zero on the first failed check (ON_ERROR_STOP).
      - name: Verify User DB RLS Policies
        run: |
          docker exec -i supabase_db_user psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
            < scripts/sql/verify-user-db-rls.sql

      # Both stacks use the same ports, so the first must be stopped before the second starts.
      - name: Stop User DB
        if: always()
        run: supabase stop --workdir supabase/user --no-backup

      - name: Start Content DB & Run Migrations
        run: supabase start --workdir supabase/content

      - name: Verify Content DB RLS Policies
        run: |
          docker exec -i supabase_db_content psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
            < scripts/sql/verify-content-db-rls.sql

      - name: Stop Content DB
        if: always()
        run: supabase stop --workdir supabase/content --no-backup

  playwright-e2e:
    name: Playwright Integration & E2E Gate (Task 17.2)
    runs-on: ubuntu-latest
    needs: verify
    # Needed by the build and again by `next start`, which re-validates the
    # environment when it loads next.config.mjs. Not real credentials (see above).
    env:
      NEXT_PUBLIC_CONTENT_SUPABASE_URL: https://czkkzoiuyqybafacpgsp.supabase.co
      NEXT_PUBLIC_CONTENT_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
      NEXT_PUBLIC_USER_SUPABASE_URL: https://bpidsbcrvpkavvdvtpgh.supabase.co
      NEXT_PUBLIC_USER_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-not-a-real-credential
      CRON_SECRET: ci-cron-secret-not-a-real-credential
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Next.js Production Build for E2E
        run: npm run build

      - name: Run Playwright E2E Journeys & Axe Audits
        run: npx playwright test --project="Desktop Chrome"
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
