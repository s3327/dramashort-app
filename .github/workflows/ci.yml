name: CI Gate

on:
  push:
    branches:
      - dramashort-app
      - main
  pull_request:
    branches:
      - dramashort-app
      - main

jobs:
  verify:
    name: Typecheck, Lint, Build, Test & Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # The values below only satisfy lib/config/env-validator.mjs, which refuses
      # to build in production with missing or placeholder configuration. None of
      # them is a real credential: the project does not exist, so requests to Supabase
      # made during the build fail and the pages fall back to empty data.
      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-not-a-real-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-credential
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-not-a-real-credential
          CRON_SECRET: ci-cron-secret-not-a-real-credential

      # ADR-0005: browser code must carry the project URL; a NEXT_PUBLIC_* value read
      # through another variable is not inlined and sign-in fails. Same URL as the build.
      - name: Browser Bundle Carries the Supabase URL
        run: npm run test:file -- __tests__/tooling/browser-bundle-env.test.ts
        env:
          VERIFY_BUILD_ENV: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://ci-not-a-real-project.supabase.co

      # Runs after the build on purpose: the bundle-budget tests read the build
      # output in .next and fail without it. The suite itself runs without any
      # of the build's environment variables, exactly as it does locally.
      - name: Automated Security & Regression Test Suite
        run: npm test

      - name: First-Load JS Bundle Budget Gate (Task 17.3)
        run: npm run check:budget

      - name: npm Dependency Security Audit Gate (P1 Step 11)
        run: npm run check:audit

  supabase-rls-verification:
    name: Supabase Database RLS & Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Same major line as the `supabase` dev dependency in package.json. The
      # configs target Postgres 17, which CLI 1.x does not know.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start Supabase & Run Migrations
        run: supabase start

      # psql exits non-zero on the first failed check (ON_ERROR_STOP).
      - name: Verify user-side RLS policies
        run: |
          docker exec -i supabase_db_dramashort psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
            < scripts/sql/verify-user-side-rls.sql

      - name: Verify catalog RLS policies
        run: |
          docker exec -i supabase_db_dramashort psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
            < scripts/sql/verify-catalog-rls.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  playwright-e2e:
    name: Playwright Integration & E2E Gate (Task 17.2)
    runs-on: ubuntu-latest
    needs: verify
    # Needed by the build and again by `next start`, which re-validates the
    # environment when it loads next.config.mjs. Not real credentials (see above).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-not-a-real-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-credential
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-not-a-real-credential
      CRON_SECRET: ci-cron-secret-not-a-real-credential
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Next.js Production Build for E2E
        run: npm run build

      - name: Run Playwright E2E Journeys & Axe Audits
        run: npx playwright test --project="Desktop Chrome"
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
